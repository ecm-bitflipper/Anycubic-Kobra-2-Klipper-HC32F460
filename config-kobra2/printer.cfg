# !Anycubic Kobra 2
# printer_size: 220x220x250

####======>Do not modify this configuration
[virtual_sdcard]
path: /mnt/UDISK/.crealityprint/upload

[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# To customize your pause/resume positions, insert your custom GCODE here
gcode:
    PAUSE_BASE

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    RESUME_BASE
#####<======Do not modify this configuration

[gcode_macro _SET_TIMELAPSE_SETUP]
gcode:
    # Intentionally ignore Sonic Pad timelapse setup commands

[gcode_macro HYPERLAPSE]
gcode:
    # Intentionally ignore Sonic Pad hyperlapse commands

#####======>Please configure according to different printer models
[mcu]
serial: /dev/serial/by-id/usb_serial_1
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1000
max_z_velocity: 8
max_z_accel: 100

[output_pin power_ctrl]
pin: PB4
value: 1
shutdown_value: 0

[stepper_x]
step_pin: PA5
dir_pin: PA4
enable_pin: !PC3
microsteps: 16
rotation_distance: 32
endstop_pin: !PA6
position_min: -4
position_endstop: -4
position_max: 220
homing_speed: 100

[stepper_y]
step_pin: PC4
dir_pin: !PA7
enable_pin: !PC3
microsteps: 16
rotation_distance: 32
endstop_pin: !PC5
position_min: -6
position_endstop: -6
position_max: 250
homing_speed: 100

[stepper_z]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
#endstop_pin: PB12 # heatbed sensor
endstop_pin: probe: z_virtual_endstop
#position_endstop: 0
position_min: -2
position_max: 230
homing_speed: 8

[extruder]
max_extrude_only_distance: 200
max_extrude_only_velocity: 60
max_extrude_only_accel: 3000
max_extrude_cross_section: 50
step_pin: PC14
dir_pin: PC15
enable_pin: !PC3
microsteps: 16
gear_ratio: 10:40
rotation_distance: 1.6565
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
min_extrude_temp: 170
control: pid
pid_kp: 22.20
pid_ki: 1.08
pid_kd: 119.0
min_temp: 0
max_temp: 275
pressure_advance: 0.0436

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_kp: 97.1
pid_ki: 1.41
pid_kd: 1675.16
min_temp: 0
max_temp: 120

[fan]
pin: PB9

[filament_switch_sensor runout]
pause_on_runout: True
switch_pin: !PC13

[heater_fan controller_fan]
pin: PA14
heater: heater_bed
heater_temp: 45.0

[heater_fan hotend_fan]
pin: PA13

[probe]
pin: PB8
x_offset: 23
y_offset: -13.5
#z_offset: 0.0
speed: 5.0          # <-- How fast the nozzle moves DOWN to probe (5mm/s)
lift_speed: 8.0     # <-- How fast it lifts UP between probes (8mm/s)

[safe_z_home]
home_xy_position: 110, 110 
speed: 100
z_hop: 10
z_hop_speed: 100
move_to_previous: False

[bed_mesh]
speed: 200
mesh_min: 20, 10
mesh_max: 190, 190
algorithm: bicubic
probe_count: 7, 7

[output_pin beeper]
pin: PB5
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001
#####<======Please configure according to different printer models

[idle_timeout]
timeout: 172800

